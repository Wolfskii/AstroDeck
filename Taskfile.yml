version: "3"

dotenv: [".env"]

tasks:
  install:
    desc: Install frontend dependencies
    cmds:
      - npm install

  dev:
    desc: Run AstroDeck in development mode (Vite + Tauri)
    cmds:
      - npx tauri dev

  build:
    desc: Build production app
    cmds:
      - npm run build
      - npx tauri build

  test:
    desc: Run all tests
    cmds:
      - npm run check
      - cd src-tauri && cargo test

  check:
    desc: Type-check frontend
    cmds:
      - npm run check

  lint:
    desc: Lint Rust code
    cmds:
      - cd src-tauri && cargo clippy -- -D warnings

  clean:
    desc: Clean build artifacts
    cmds:
      - cd src-tauri && cargo clean
      - rm -rf dist

  deploy:
    desc: Build and package native app for current OS
    cmds:
      - node scripts/package-app.mjs --clean

  deploy:windows:
    desc: Build Windows native package artifacts
    cmds:
      - node scripts/package-app.mjs --clean --platform windows --target x86_64-pc-windows-msvc

  deploy:macos:
    desc: Build macOS native package artifacts
    cmds:
      - node scripts/package-app.mjs --clean --platform macos --target aarch64-apple-darwin

  deploy:linux:
    desc: Build Linux native package artifacts
    cmds:
      - node scripts/package-app.mjs --clean --platform linux --target x86_64-unknown-linux-gnu
