name: Release

on:
  push:
    branches:
      - develop
      - production

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      channel: ${{ steps.resolve.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Resolve release version
        id: resolve
        run: node scripts/ci-resolve-version.mjs "${{ github.ref_name }}"

      - name: Sync project version files
        run: node scripts/sync-version.mjs

      - name: Commit resolved version to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          if git diff --staged --quiet; then
            echo "Version files already match ${{ steps.resolve.outputs.version }}"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.resolve.outputs.version }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload version manifest
        uses: actions/upload-artifact@v7
        with:
          name: version-files
          path: |
            VERSION
            version-manifest.json
            package.json
            package-lock.json
            src-tauri/Cargo.toml
            src-tauri/tauri.conf.json
          retention-days: 1

  build:
    needs: version
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: macos
            os: macos-latest
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download resolved version files
        uses: actions/download-artifact@v8
        with:
          name: version-files
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundles
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "linux" ]; then
            # deb/rpm do not need the flaky AppRun download used by AppImage.
            npx tauri build --target "${{ matrix.rust_target }}" --bundles deb,rpm
            appimage_ok=0
            for attempt in 1 2 3; do
              echo "AppImage bundle attempt ${attempt}/3"
              if npx tauri build --target "${{ matrix.rust_target }}" --bundles appimage; then
                appimage_ok=1
                break
              fi
              sleep $((attempt * 8))
            done
            if [ "$appimage_ok" -ne 1 ]; then
              echo "::warning::AppImage bundling failed after retries (often a transient AppRun download). Continuing with deb/rpm."
            fi
          else
            npx tauri build --target "${{ matrix.rust_target }}"
          fi
        env:
          CI: true

      - name: Collect release artifacts
        run: node scripts/ci-collect-artifacts.mjs ${{ matrix.platform }} ${{ matrix.rust_target }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release-artifacts/${{ matrix.platform }}/*
          retention-days: 7

  release:
    needs: [version, build]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Apply resolved version to workspace
        run: |
          echo "${{ needs.version.outputs.version }}" > VERSION
          node scripts/sync-version.mjs
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = {
            version: "${{ needs.version.outputs.version }}",
            tag: "${{ needs.version.outputs.tag }}",
            prerelease: ${{ needs.version.outputs.prerelease == 'true' }},
            channel: "${{ needs.version.outputs.channel }}",
          };
          fs.writeFileSync("version-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-windows
          path: dist/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-linux
          path: dist/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-macos
          path: dist/macos

      - name: Generate release notes
        run: node scripts/ci-changelog.mjs

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: AstroDeck ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.version.outputs.prerelease }}
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          if git diff --staged --quiet; then
            echo "No version file changes to commit"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ needs.version.outputs.version }} [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
