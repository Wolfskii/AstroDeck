[package]
name = "astrodeck"
version = "0.1.15-5"
description = "Context-aware control deck for touchscreen monitors"
authors = ["AstroDeck Contributors"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
sysinfo = "0.33"
notify = "7"
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2.5"
protobuf = "3"
librespot-core = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63" }
librespot-metadata = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-playback = { git = "https://github.com/nolight132/librespot", rev = "e7eb953d5848fd97bacd00e6c0e33500765eaa63", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
http = "1.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Dwm",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
] }
wasapi = "0.19"
rustfft = "6.4"

[target.'cfg(target_os = "macos")'.dependencies]
media-remote = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

# librespot-core 0.8's build.rs uses vergen-gitcl 1.0, which otherwise pulls two
# incompatible vergen-lib versions into the same graph.
[patch.crates-io]
vergen-gitcl = { path = "vendor/vergen-gitcl" }
